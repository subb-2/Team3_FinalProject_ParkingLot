# ByteTrack 설정 (이 프로젝트 전용)
#
# ultralytics 패키지에 내장된 기본값을 복사해 프로젝트에서 관리.
# 패키지를 재설치해도 설정이 유지되도록 하기 위함.
#
# ---------------------------------------------------------------------------
# 중요: 이 값들은 B01_car_detection.py의 CONF_THRESH와 함께 봐야 한다.
#
# ByteTrack의 핵심은 '신뢰도가 낮은 박스도 2차로 재매칭해서 추적을 살리는 것'.
# 그런데 검출기(YOLO)가 약한 박스를 먼저 버려버리면 그 박스는 추적기까지
# 오지도 못하므로, 2차 연관이 동작할 수 없다.
#
#   (잘못된 조합) 검출 conf 0.25 + track_high_thresh 0.25
#       -> 저신뢰 버킷 범위 (0.1, 0.25)에 들어올 박스가 존재하지 않음
#       -> ByteTrack이 평범한 IoU 추적기로 퇴화
#
# 따라서 '거르는 위치'를 car_detection이 아니라 car_bytetrack 내부로 옮김.
#   검출기는 낮게(0.05) 잡아 약한 박스까지 전달하고,
#   1차 연관 기준(track_high_thresh)을 여기서 높게 둔다.
#
# 실측: 차량이 멈춰 있고 검출이 흐릿해지는 구간에서
#       기존 설정은 20프레임만 지속돼도 트랙이 분열했지만,
#       아래 설정에서는 120프레임까지 동일 ID를 유지.
# ---------------------------------------------------------------------------

tracker_type: bytetrack

# 1차 연관 기준. 검출기 대신 여기서 고신뢰 박스를 가른다.
track_high_thresh: 0.4

# 2차 연관 하한. 이 값과 track_high_thresh 사이의 박스로 끊긴 추적을 복구한다.
# 검출기 CONF_THRESH(0.05)보다 낮거나 같아야 실제로 박스가 들어온다.
track_low_thresh: 0.05

# 새 트랙 생성 기준. 낮추면 오검출이 새 트랙을 만들어 FIFO의 차량번호를
# 소모해버리므로, track_high_thresh와 같은 수준으로 높게 유지할 것.
new_track_thresh: 0.4

# 소실된 트랙을 유지할 프레임 수.
# 참고: 차량이 정지한 채 완전히 검출되지 않으면 칼만 필터가 계속 앞으로
# 예측해 실제 위치와 어긋나므로, 이 값을 늘려도 20프레임 이상은 복구되지 않는다.
# 완전 소실 구간은 이 값보다 track_low_thresh(2차 연관)로 대응하는 것이 효과적이다.
track_buffer: 30

# 연관 판정 임계값(IoU 거리 기준).
# 실측상 칼만 예측이 등속 운동을 잘 따라가므로 기본값으로 충분.
match_thresh: 0.8

# 검출 점수를 연관 비용에 반영할지 여부.
fuse_score: True
