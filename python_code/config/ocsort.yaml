# OC-SORT 설정 (이 프로젝트 전용 / 현재 사용 중인 추적기)
#
# 논문 : https://arxiv.org/abs/2203.14360  (Observation-Centric SORT, CVPR 2023)
# 구현 : ultralytics/trackers/oc_sort.py   (class OCSORT(BYTETracker))
#
# ultralytics 내장 기본값을 복사해 프로젝트에서 관리.
# 패키지를 재설치해도 설정이 유지되도록 하기 위함.
#
# ===========================================================================
# 왜 ByteTrack에서 OC-SORT로 바꿨나
#
# ByteTrack의 실패 지점:
#   차가 가려져 검출이 끊김 -> 트랙이 Lost -> 칼만이 계속 '등속'으로 앞으로 예측
#   -> 실제 차는 멈춰 있는데 예측 박스만 전진 -> 다시 보일 때 IoU=0 -> 새 ID 발급.
#
#   config/bytetrack.yaml에 적어둔 관찰 - "차량이 정지한 채 완전히 검출되지
#   않으면 칼만 필터가 계속 앞으로 예측해 실제 위치와 어긋나므로, track_buffer를
#   늘려도 20프레임 이상은 복구되지 않는다" - 가 정확히 이 현상이다.
#
# OC-SORT가 이걸 푸는 방식 3가지:
#   OCR : 칼만 예측이 아니라 '마지막으로 실제 관측된 박스 위치'로 재매칭한다.
#         정지한 차는 그 자리에 그대로 있으므로 예측 오차와 무관하게 복구된다.
#   ORU : 트랙이 되살아나면 [마지막 관측 ~ 새 관측] 사이를 보간한 가상 궤적으로
#         칼만을 다시 돌려 오염된 상태를 복구한다. 복귀 직후 또 튀는 것을 막는다.
#   OCM : 진행 방향 일관성을 연관 비용에 반영한다. (아래 inertia 항목 참고)
#
# 두 알고리즘은 서로 다른 문제를 푼다. 배타적이지 않다.
#   ByteTrack : 박스가 '약해진' 경우 (conf 하락)
#   OC-SORT   : 박스가 '사라진' 경우 (검출 실패 후 복귀)
# 그래서 use_byte: True로 둘 다 켠다. (use_byte 항목 필독)
#
# ---------------------------------------------------------------------------
# 연관(association) 단계 순서 - 파라미터가 어디에 쓰이는지 이해하려면 이 순서를 볼 것
#
#   1) 1차 연관   : 칼만 예측 IoU + OCM        <- track_high_thresh 이상 박스
#   2) OCR        : '마지막 관측' IoU           <- 1차에서 못 붙은 트랙 구제
#   3) 2차 연관   : ByteTrack 저신뢰 재매칭     <- use_byte: True일 때만 동작
#   4) 신규 트랙  : new_track_thresh 이상
#
# ---------------------------------------------------------------------------
# 한계 (알고 쓸 것)
#
# OCR도 결국 IoU 기반이다. '마지막 관측 박스'와 '새 검출'이 겹쳐야 매칭된다.
# 즉 차가 마지막으로 보였던 자리 근처에 다시 나타나야 복구된다.
#
# 실측 (합성 시나리오, 차 2대, track_buffer 60으로 통일해 알고리즘 차이만 비교.
#       차가 등속으로 달리다 가려지고, 가려진 '동안' 거동이 바뀌는 상황.
#       숫자는 발급된 Track ID 총 개수 - 2면 ID 유지 성공, 3이면 스위치 발생):
#
#   가림 중 거동      가림 프레임    bytetrack   ocsort
#   정지              15 / 25 / 40      3           2    <- 개선
#   90도 선회         15 / 25 / 40      3           3
#   후진              15 / 25 / 40      3           3
#
# 즉 OC-SORT가 확실히 잡아주는 것은 '가려진 동안 차가 멈추는' 경우다.
# 손에 가려지는 상황이 대부분 여기 해당한다. (다가와서 멈춤 -> 손이 덮음)
# 반대로 가려진 동안 차가 다른 방향으로 이동해 버리면 - 기둥 뒤를 통과하는
# 경우 - 마지막 관측과 겹치지 않아 OC-SORT도 ID를 못 지킨다.
#
# 참고로 등속 직진이 유지되는 구간은 칼만 예측이 정확해서 애초에 ByteTrack도
# 안 놓친다. 두 알고리즘의 차이는 '운동이 바뀌는' 순간에만 드러난다.
#
# 기둥 케이스는 기둥 위치 마스킹 + car_id 재바인딩 레이어로 따로 대응해야 한다.
# ===========================================================================

tracker_type: ocsort

# 1차 연관 기준. 검출기(B01) 대신 여기서 고신뢰 박스를 가른다.
track_high_thresh: 0.4

# 2차 연관 하한. 이 값과 track_high_thresh 사이의 박스로 끊긴 추적을 복구한다.
# B01_car_detection.py의 CONF_THRESH(0.05)보다 낮거나 같아야 실제로 박스가 들어온다.
# use_byte: False면 이 값은 아무 의미가 없다.
track_low_thresh: 0.05

# 새 트랙 생성 기준. 낮추면 오검출이 새 트랙을 만들어 FIFO의 차량번호를
# 소모해버리므로, track_high_thresh와 같은 수준으로 높게 유지할 것.
new_track_thresh: 0.4

# 소실된 트랙을 유지할 프레임 수. 30fps 기준 2초.
#
# ByteTrack에서는 이 값을 늘려도 소용없었다. 칼만 예측이 계속 전진해서
# 오래 살려둘수록 엉뚱한 위치에 있었기 때문이다.
# OC-SORT는 OCR이 '마지막 관측 위치'로 매칭하고 ORU가 복귀 시 상태를 복구하므로,
# 이제 이 값을 늘리는 것이 실제로 도움이 된다.
track_buffer: 60

# 연관 판정 임계값(비용 기준. IoU 거리 + inertia*OCM).
# 값이 클수록 관대하다. 0.85 = IoU 0.15 이상이면 후보로 인정.
match_thresh: 0.85

# 검출 점수를 연관 비용에 반영할지 여부.
fuse_score: True

# --- OC-SORT 전용 ---------------------------------------------------------

# OCM의 속도 방향을 계산할 때 몇 프레임 전 관측과 비교할지.
delta_t: 3

# OCM(진행 방향 일관성) 비용의 가중치. ultralytics 기본값은 0.2.
#
# 0.1로 낮춘 이유:
#   정지한 차는 속도 벡터가 0이 되고, 구현상 arccos(0)=pi/2 -> 방향 비용이
#   모든 후보에 대해 균일하게 0.5로 깔린다. inertia가 0.2면 모든 비용에
#   +0.1이 얹혀 match_thresh 0.85가 정지 차량에 한해 실질 0.75로 깎이는 셈이다.
#   주차장은 멈춰 있는 차가 대부분이라 기본값은 과하다.
#
#   또한 OCM은 서로 교차하는 물체들의 스왑을 막는 장치인데(댄서, 선수 등),
#   차가 몇 대 없고 천천히 움직이는 이 환경에서는 이득이 크지 않다.
# 0.0으로 두면 OCM을 끄고 ORU/OCR만 취할 수 있다.
inertia: 0.1

# !! 중요 !! ByteTrack 방식의 저신뢰 2차 연관을 함께 사용할지 여부.
#
# ultralytics 기본값은 False다. 그대로 두면 oc_sort.py의 _second_association이
# 통째로 건너뛰어지고(unmatched 트랙은 바로 mark_lost), 지금까지 쓰던
# ByteTrack의 2차 연관 기능이 '꺼진다'. 개선은커녕 나빠질 수 있다.
#
# True로 두어야 OC-SORT(ORU/OCR)와 ByteTrack(저신뢰 재매칭)을 둘 다 쓴다.
# 단, 이게 실제로 동작하려면 B01의 CONF_THRESH가 track_low_thresh 이하여야 한다.
use_byte: True
