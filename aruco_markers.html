<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Aruco Markers</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #f0f0f0;
    }
    .page {
        width: 210mm;
        height: 297mm;
        padding: 15mm;
        margin: 10mm auto;
        background: white;
        box-sizing: border-box;
        page-break-after: always;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(5, 1fr);
        gap: 10px;
        height: 100%;
        align-items: center;
        justify-items: center;
    }
    .marker {
        text-align: center;
        font-family: Arial, sans-serif;
        font-size: 14px;
        font-weight: bold;
    }
    .marker img {
        width: 140px;
        height: 140px;
        border: 1px solid #ccc;
    }
    @media print {
        body { background-color: white; }
        .page { margin: 0; width: 100%; height: 100%; border: none; box-shadow: none; page-break-after: always; }
    }
</style>
</head>
<body>

<!-- 첫 번째 장 (1~15) -->
<div class="page">
    <div class="grid">
        <div class="marker"><img src="dataset/aruco-1.svg" alt="aruco-1"><br>ID: 1</div>
